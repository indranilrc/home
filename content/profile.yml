name: Indranil Roychoudhury
eyebrow: Principal AI Scientist at SLB
description: >-
  Indranil Roychoudhury is a Principal AI Scientist at SLB working on diagnostics,
  prognostics, and physics-informed machine learning for industrial systems.
lede: I work on knowing when complex machines are about to fail, and what to do before they do.
bio: |
  My research combines physics-based models with machine learning for diagnostics and prognostics.
  I spent nine years at NASA Ames Research Center working on spacecraft power systems, electric
  aircraft, and the safety of the National Airspace System. Since 2018 I have been at SLB, applying
  the same ideas to drilling, production equipment, and new energy systems.

  I did my PhD at Vanderbilt University on distributed diagnosis, co-wrote the textbook
  *Prognostics: The Science of Making Predictions*, and am a Fellow of the PHM Society. I also teach
  advanced time series analysis to engineers in industry. I'm always glad to hear from people
  working on similar problems.
